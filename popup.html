<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="logo-container">
    <img src="icons/logo.png" alt="Logo" class="logo">
  </div>
  
  <header>
    <h1>Focus Flow</h1>
    <div id="currentTime" class="current-time">--:-- --</div>
  </header>
  
  <div class="display-container glass">
    <svg class="progress-svg" viewBox="0 0 240 240">
      <circle class="progress-bg" cx="120" cy="120" r="110"></circle>
      <circle id="progressValue" class="progress-value" cx="120" cy="120" r="110"></circle>
    </svg>
    <div class="display-content">
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Inactive</span>
      </div>
      <div class="time-labels">
        <span>HR</span>
        <span>MIN</span>
        <span>SEC</span>
      </div>
      <div id="display" class="time-display">00:00:00</div>
      <div class="milliseconds">.00</div>
    </div>
  </div>

  <div class="controls">
    <button id="startStopBtn" class="btn primary">Start</button>
    <button id="resetBtn" class="btn secondary">Reset</button>
  </div>

  <div class="secondary-controls">
    <button id="historyToggleBtn" class="btn-text">View History</button>
  </div>

  <div id="historyPanel" class="history-panel glass hidden">
    <div class="heatmap-header">
      <h2>Activity Heatmap</h2>
      <span class="heatmap-year" id="heatmapYear">Last 365 Days</span>
    </div>
    <div class="heatmap-wrapper">
      <div id="heatmapGrid" class="heatmap-grid"></div>
    </div>
    
    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-label">This Week</span>
        <span id="statWeekly" class="stat-value">0h 0m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">This Month</span>
        <span id="statMonthly" class="stat-value">0h 0m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Daily Avg</span>
        <span id="statAverage" class="stat-value">0h 0m</span>
      </div>
    </div>
    
    <div class="extra-stats-grid">
      <div class="stat-box">
        <span class="stat-label">Best Day</span>
        <span id="bestDayBadge" class="stat-value small-text">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Worst Day</span>
        <span id="worstDayBadge" class="stat-value small-text">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Avg Start</span>
        <span id="avgStartTime" class="stat-value small-text">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Longest Session</span>
        <span id="longestSessionTime" class="stat-value small-text">-</span>
      </div>
    </div>
    
    <div class="chart-container">
      <span class="chart-title">Time of Day</span>
      <div class="bar-chart" id="timeOfDayChart">
        <div class="bar-wrapper"><div class="bar" id="barMorning"></div><span>Morn</span></div>
        <div class="bar-wrapper"><div class="bar" id="barAfternoon"></div><span>Aft</span></div>
        <div class="bar-wrapper"><div class="bar" id="barEvening"></div><span>Eve</span></div>
        <div class="bar-wrapper"><div class="bar" id="barNight"></div><span>Ngt</span></div>
      </div>
    </div>
    
    <div class="settings-section">
      <label class="settings-label" for="dailyGoalInput">Daily Goal (Hours)</label>
      <input type="number" id="dailyGoalInput" class="settings-input" min="1" max="24" value="8">
    </div>

    <div id="dayDetails" class="day-details">
      <div class="details-header-row">
        <span id="detailsDate" class="details-date">Select a date</span>
        <span id="detailsTime" class="details-time">00:00:00</span>
      </div>
      
      <div class="goal-progress-box">
        <span class="day-stat-label">Goal Progress</span>
        <span id="dayGoalVal" class="day-stat-val large">-</span>
        <div class="mini-progress-track">
          <div id="dayGoalBar" class="mini-progress-fill" style="width: 0%"></div>
        </div>
      </div>
      
      <div class="day-stats-grid">
        <div class="day-stat-box">
          <span class="day-stat-label">Manual Pauses</span>
          <span id="dayManualVal" class="day-stat-val">-</span>
        </div>
        <div class="day-stat-box">
          <span class="day-stat-label">Inactivity Pauses</span>
          <span id="dayIdleVal" class="day-stat-val">-</span>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>


</html>
